server {
    listen 127.0.0.1:18096;
    server_name localhost;
    access_log off;
    location = /healthz {
        default_type text/plain;
        return 200 'healthy\n';
    }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    server_name srv1934103.hstgr.cloud;
    ssl_certificate /etc/nginx/tls/srv1934103.hstgr.cloud.crt;
    ssl_certificate_key /etc/nginx/tls/srv1934103.hstgr.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    access_log off;
    server_tokens off;

    auth_basic "Multi Agent Platform";
    auth_basic_user_file /etc/nginx/auth/htpasswd;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;

    # This endpoint provides monitoring only. Hooks remain local, and raw
    # conversation fragments are not exposed by the remote gateway.
    location ^~ /hooks/ { return 404; }
    location ~ ^/agents/[^/]+/raw/?$ { return 404; }

    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18095;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }
}
