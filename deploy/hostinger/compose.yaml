name: multi-ai-agent-platform

services:
  gateway:
    image: ${NGINX_IMAGE:?Set a verified nginx image digest in .env}
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/auth/htpasswd:ro
      - ${TLS_DIRECTORY:?Set the existing renewed certificate directory}:/etc/nginx/tls:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    # The existing Caddy service renews the mounted certificate. Reload it
    # every six hours without interrupting active connections.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        nginx -t
        (while sleep 21600; do nginx -t && nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:18095/ && wget -qO- http://127.0.0.1:18096/healthz | grep -qx healthy"]
      interval: 30s
      timeout: 3s
      retries: 3

