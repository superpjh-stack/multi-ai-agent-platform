# 멀티 에이전트 대시보드 설정 (spec.md §1.3 · §4.2 · §11)
# 원천 경로의 기본값. 실행 시 환경변수 AGENTDASH_CLAUDE_HOME · AGENTDASH_AGENTS_ROOT 가 있으면 그것이 이긴다.
# 원천은 읽기 전용이다 — 대시보드는 이 두 경로 아래에 쓰지 않는다 (G-14 · V-05).
sources:
  claude_home: "~/.claude"            # S1~S7 (sessions · projects)
  agents_root: "~/Desktop/AI Coding"  # S8 · S9 (<NN> * Agent/{outputs,progress.md})

server:
  host: "127.0.0.1"   # 바꾸지 않는다 — 127.0.0.1 이 아니면 settings.py 가 기동을 거부한다 (G-16 · V-06)
  port: 8095          # 개발 중 다른 포트가 필요하면 AGENTDASH_PORT=8096 · 8097

db:
  path: "data/agentdash.db"   # 이 폴더 기준 상대 경로. 개발마다 AGENTDASH_DB=data/agentdash-dev{N}.db

state:
  stale_after_sec: 300   # Q2 확정 — STALE_AFTER 5 분 (spec.md §4.2)
  slow_after_sec: 90     # SLOW_AFTER 90 초 — 서브에이전트 R-09 / R-12 경계

backfill:
  since: "2026-08-01"    # Q6 — 전체 (2026-08-01 ~)

collect:
  batch_sec: 1           # 감시 이벤트 1 초 묶음 (spec.md §2.2)
  rescan_sec: 60         # 감시 누락 대비 mtime 재스캔 (spec.md §2.2)
  state_tick_sec: 10     # 살아 있는 에이전트 재판정 주기 (spec.md §4.2)
  pipeline_tick_sec: 300 # 파이프라인 재판정 주기 (spec.md §7.1)

limits:
  text_max: 300          # DB TEXT 값 상한 (G-13 · V-04)
  description_max: 120   # 설명 · 대상 앞 120 자 (spec.md §2.3)
  hook_body_max_bytes: 1048576   # 훅 본문 1 MB 제한 (spec.md §8)
