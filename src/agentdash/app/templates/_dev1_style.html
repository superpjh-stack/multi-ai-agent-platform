<style>
  /* D-04 · D-05 · D-06 공용 (개발1). 상태 색은 개발2 _dev2_style.html 과 같은 값 — 같은 상태는 같은 색. */
  :root {
    --st-RUNNING:#1f9d55; --st-WAITING_INPUT:#d4a400; --st-WAITING_PERMISSION:#e8710a; --st-SLEEPING:#2f6fdb;
    --st-WAITING_CHILD:#36a9d6; --st-DONE:#8e8e93; --st-FAILED:#d93025; --st-STALE:#8e44ad; --st-UNKNOWN:#b0b0b0;
    --st-NONE:#d8d8dc;
    --card:#ffffff; --soft:#f0f0f3; --accent:#2a78d6; --grid:#e1e0d9; --axis:#c3c2b7;
    --p-DONE:#5b5b60; --p-PARTIAL:#c7c7cc; --p-IN_PROGRESS:#1f9d55; --p-NOT_STARTED:#ffffff; --p-UNKNOWN:#ececef;
    --p-ink-DONE:#ffffff; --p-ink:#1d1d1f; --badge:#e8710a;
  }
  @media (prefers-color-scheme: dark) { :root {
    --card:#1f1f21; --soft:#2a2a2d; --accent:#3987e5; --grid:#2c2c2a; --axis:#383835; --st-NONE:#3a3a3c;
    --p-DONE:#c7c7cc; --p-PARTIAL:#5b5b60; --p-NOT_STARTED:#161617; --p-UNKNOWN:#2a2a2d; --p-ink-DONE:#161617; --p-ink:#f5f5f7;
  } }
  main { max-width: 1400px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 16px; margin: 18px 0 8px; }
  form.filters { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:end; margin-bottom:12px; font-size:13px; }
  form.filters label { display:flex; flex-direction:column; gap:2px; color:var(--muted); }
  form.filters input, form.filters select, form.filters button, a.btn {
    font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  a.btn { text-decoration:none; display:inline-block; }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin-bottom:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0; }
  .card .n { font-size:22px; font-weight:600; font-variant-numeric: tabular-nums; }
  .card .k { color:var(--muted); font-size:13px; }
  .est { display:inline-block; font-size:12px; color:var(--warn); border:1px solid var(--warn); border-radius:4px; padding:0 4px; }
  .tablewrap { overflow-x:auto; max-width:100%; }
  table { border-collapse: collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  td.name { overflow-wrap:anywhere; min-width:140px; }
  svg.chart { display:block; max-width:100%; }
  svg.chart .bar { fill:var(--accent); }
  svg.chart .bar:hover { opacity:.8; }
  svg.chart .grid { stroke:var(--grid); stroke-width:1; }
  svg.chart .axis { stroke:var(--axis); stroke-width:1; }
  svg.chart .tick { fill:var(--muted); font-size:11px; }
  svg.chart .area { fill:var(--accent); opacity:.35; stroke:var(--accent); stroke-width:1.5; }
  svg.chart .hit { fill:transparent; }
  svg.chart .hit:hover { fill:var(--accent); opacity:.15; }
  .muted { color:var(--muted); }
  .warn { color:var(--warn); }
  code { font-size:12px; overflow-wrap:anywhere; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin:6px 0; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px;
              background:var(--c); border:1px solid var(--line); }
</style>
